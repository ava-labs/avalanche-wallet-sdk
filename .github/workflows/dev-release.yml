name: Release dev branch (alpha)
on:
    push:
        branches:
            - dev
permissions: {}

jobs:
    release:
        permissions:
          contents: write
          id-token: write
          issues: write
          pull-requests: write
        name: Release Dev Branch
        runs-on: ubuntu-latest
        env:
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
              with:
                  fetch-depth: 0
                  persist-credentials: true  # kept: job runs git commands that use the checkout token
            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  cache: yarn
                  node-version: 20.x
            - name: add .npmrc
              run: echo '//registry.npmjs.org/:_authToken= ${{ secrets.NPM_TOKEN_READONLY }}' >> .npmrc
            - name: Install dependencies
              run: yarn install
            - name: add publishing .npmrc
              run: echo '//registry.npmjs.org/:_authToken= ${{ secrets.NPM_TOKEN }}' >> .npmrc
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_BRANCH: dev
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: yarn run semantic-release
